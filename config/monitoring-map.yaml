  - {key: cabinet_new_tools,     title: "Новые инструменты в личных кабинетах",        method: cabinet_snapshot_diff}
  - {key: feature_appear_vanish, title: "Исчезновение или появление функций",          method: cabinet_snapshot_diff}
  - {key: category_limits,       title: "Новые ограничения в категориях товаров",      method: doc_diff}
  - {key: major_seller_case,     title: "Крупные кейсы селлеров",                      method: editorial_pick}
  - {key: analytical_reports,    title: "Аналитические отчёты",                        method: registry_watch}
  - {key: court_documents,       title: "Судебные документы",                          method: registry_watch}
