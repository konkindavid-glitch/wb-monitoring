# Матрица оценки, пороги очереди и стоп-правила
# Обоснование — docs/01-triage-scoring.md
#
# ВАЖНО: сумма баллов определяет ПРИОРИТЕТ ОЧЕРЕДИ, а не разрешение на публикацию.
# Публикацию решают четыре гейта через AND, см. docs/03-handoff.md §3.
#
# Любая правка весов и порогов — с датой и причиной в комментарии рядом.
# Веса, изменённые «на глаз» и не записанные, через месяц необъяснимы.

version: 1
updated: "2026-08-27"

# ---------------------------------------------------------------------------
#  ФАКТОРЫ МАТРИЦЫ (14 штук, веса из ТЗ §9 без изменений)
# ---------------------------------------------------------------------------
factors:

  # --- положительные ---
  - key: platform_wb
    title: "Wildberries"
    weight: 25
  - key: seller_money_impact
    title: "Напрямую влияет на деньги селлеров"
    weight: 25
  - key: rules_change
    title: "Меняет правила, оферту, комиссии, штрафы или логистику"
    weight: 20
  - key: authoritative_source
    title: "Есть подтверждение из авторитетного источника"
    weight: 15
  - key: is_fresh
    title: "Новость свежая"
    weight: 15
  - key: has_practical_takeaway
    title: "Есть практический вывод для продавца"
    weight: 15
  - key: mass_effect
    title: "Массовый эффект для рынка"
    weight: 15
  - key: ai_link
    title: "Связь с AI и маркетплейсами"
    weight: 10
  - key: legal_tax_risk
    title: "Судебный, налоговый или регуляторный риск"
    weight: 10
  - key: has_conflict
    title: "Есть конфликт, скандал или проблема"
    weight: 10

  # --- отрицательные ---
  - key: is_repeat
    title: "Это повтор без нового факта"
    weight: -30
  - key: is_old
    title: "Старый материал"
    weight: -40
  - key: no_confirmation
    title: "Нет подтверждения"
    weight: -50
  - key: is_advertising
    title: "Рекламный материал"
    weight: -60

# Справочно, считается из factors — сверяется tools/validate.py
score_bounds:
  max_positive: 160
  min_negative: -180

# Обоснование обязательно у каждого сработавшего фактора.
# Фактор без поля why не засчитывается (docs/01 §6).
require_why_on_hit: true

# ---------------------------------------------------------------------------
#  ПОРОГИ ОЧЕРЕДИ (из ТЗ §9, формулировка результата изменена: очередь, не публикация)
# ---------------------------------------------------------------------------
thresholds:
  - decision: URGENT
    min_score: 80
    title: "В голову очереди, немедленно на проверку и разбор"
  - decision: QUEUE
    min_score: 60
    title: "В работу, если нет более важного"
  - decision: BACKLOG
    min_score: 40
    title: "Хранить; поднять при появлении подтверждения или развития"
  - decision: DROP
    min_score: null
    title: "Не использовать; сохраняется с причиной"

# Тай-брейк внутри полосы, по порядку (docs/01 §5.1).
# Приоритет площадки в сумму баллов НЕ входит.
tie_breakers:
  - platform_priority_value
  - discovered_at_asc
  - effective_date_within_14_days

# Подъём из BACKLOG (docs/01 §5.2)
backlog:
  recheck_on:
    - "появилось независимое подтверждение"
    - "то же событие пришло из авторитетного источника"
  expire_after_days: 14
  expire_reason: EXPIRED_IN_BACKLOG

# ---------------------------------------------------------------------------
#  СТОП-ПРАВИЛА (ТЗ §8)
#  Срабатывают ДО подсчёта баллов. Каждое срабатывание пишется
#  в stop_rule_drops с кодом причины — молчаливый отсев запрещён.
# ---------------------------------------------------------------------------
stop_rules:
  - code: STOP_PR_RELEASE
    title: "Мелкие рекламные пресс-релизы без пользы для селлеров"
  - code: STOP_PRODUCT_ROUNDUP
    title: "Подборки товаров"
  - code: STOP_DISCOUNT_NOISE
    title: "Скидки и распродажи без рыночного значения"
  - code: STOP_MINOR_PROMO
    title: "Маркетплейс запустил маленькую акцию"
  - code: STOP_SERVICE_AD
    title: "Очевидная реклама сервисов"
  - code: STOP_UNCONFIRMED_RUMOR
    title: "Слухи без указания источника вообще"
    note: >-
      Не путать с фактором no_confirmation (−50). Стоп-правило — когда источник
      не назван и проверять нечего. Фактор — когда источник назван, но
      независимого подтверждения пока нет. См. docs/00 §5.1.
  - code: STOP_RETELLING
    title: "Пересказ без нового факта"
  - code: STOP_OLD_NEWS
    title: "Старые новости"
  - code: STOP_DUPLICATE
    title: "Дубли одной и той же темы"
  - code: STOP_BUYER_ONLY
    title: "Касается только покупателей, не влияет на продавцов, рынок и правила"
  - code: STOP_TOO_GENERAL
    title: "Слишком общие статьи без конкретики"
  - code: STOP_MOTIVATIONAL
    title: "Мотивационные посты без фактов"
  - code: STOP_OPINION_NO_DATA
    title: "Личные мнения без данных"
  - code: STOP_NO_SOURCE
    title: "Невозможно проверить источник"

# ---------------------------------------------------------------------------
#  КАЛИБРОВКА (docs/01 §7)
# ---------------------------------------------------------------------------
calibration_metrics:
  - metric: urgent_to_publication_rate
    means: "Порог URGENT слишком низкий, если доля мала"
    action: "Поднять min_score для URGENT"
  - metric: publications_from_backlog_rate
    means: "Порог QUEUE слишком высокий, если доля велика"
    action: "Опустить min_score для QUEUE"
  - metric: dropped_but_covered_by_competitors
    means: "Прямая мера пропусков"
    action: "Разбор поштучно, правка весов"
  - metric: stop_rule_hits_per_week
    means: "Правило-пылесос"
    action: "Ослабить или уточнить правило"
