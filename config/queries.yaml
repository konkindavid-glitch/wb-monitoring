# Группы поисковых запросов и расписание опроса
# Обоснование частот — docs/02-cadence.md
# Все 89 запросов перенесены из ТЗ §6 без потерь:
#   Wildberries 28 (wb_core 12 + wb_extended 16), Ozon 19,
#   Яндекс Маркет 15, AI 15, регулирование 12

version: 1
updated: "2026-08-27"

# ---------------------------------------------------------------------------
#  КЛАССЫ ЧАСТОТЫ
# ---------------------------------------------------------------------------
cadence_classes:
  - key: A
    period_seconds: 300
    title: "5 минут"
    rationale: "Здесь скорость конвертируется в деньги селлера"
  - key: B
    period_seconds: 900
    title: "15 минут"
    rationale: "Официальные каналы Ozon и Яндекс Маркета, отраслевые СМИ"
  - key: C
    period_seconds: 1800
    title: "30 минут"
    rationale: "Оферты и тарифы правят редко; ценность даёт сравнение снапшотов, а не частота"
  - key: D
    period_seconds: 3600
    title: "1 час"
    rationale: "API, AI, регуляторика — суточный ритм источника"
  - key: E
    period_seconds: 14400
    title: "4 часа"
    rationale: "Картотека дел и площадки P4 жёстко ограничивают частоту опроса"
  - key: F
    period_seconds: 86400
    title: "сутки"
    rationale: "Тренд, изменившийся за час, — не тренд"

# Временное ускорение по событию (docs/02 §2.2)
escalation:
  mass_detector_fired:
    condition: ">=5 независимых сообщений об одной проблеме за 60 минут"
    class_a_period_seconds: 60
    class_b_c_period_seconds: 300
    reset_after_quiet_seconds: 7200
  doc_diff_detected:
    condition: "обнаружен diff оферты или тарифов"
    action: "смежные документы той же площадки опрашиваются немедленно, вне расписания"
    reset_after: "один полный круг"

